
<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administración | Velunara</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,#32164d 0%,#120b1c 45%,#050309 100%);
    color:white;
}

.login-screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    padding:40px 30px;
    background:rgba(20,10,30,.94);
    border:1px solid rgba(190,130,255,.35);
    border-radius:20px;
    box-shadow:
        0 0 50px rgba(130,60,180,.25),
        inset 0 0 30px rgba(255,255,255,.02);
    text-align:center;
}

.login-symbol{
    font-size:48px;
    margin-bottom:10px;
}

.login-box h1{
    font-family:Georgia,serif;
    font-size:30px;
    margin-bottom:8px;
}

.login-box p{
    color:#c7b7d8;
    margin-bottom:28px;
}

.input-group{
    text-align:left;
    margin-bottom:17px;
}

.input-group label{
    display:block;
    margin-bottom:7px;
    color:#d8c7e8;
    font-size:14px;
}

.input-group input{
    width:100%;
    padding:13px 14px;
    border-radius:10px;
    border:1px solid #5b3970;
    background:#100a16;
    color:white;
    outline:none;
    font-size:15px;
}

.input-group input:focus{
    border-color:#b47cff;
    box-shadow:0 0 10px rgba(180,124,255,.2);
}

.login-button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#7d3bb1,#b26cff);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.login-button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(140,70,200,.35);
}

.login-button:disabled{
    opacity:.6;
    cursor:wait;
}

.login-error{
    display:none;
    margin-top:15px;
    padding:11px;
    border-radius:8px;
    background:rgba(180,30,50,.15);
    border:1px solid rgba(255,70,90,.35);
    color:#ff9da8;
    font-size:14px;
}

.admin{
    display:none;
    min-height:100vh;
}

header{
    padding:22px 30px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(5,3,9,.65);
    backdrop-filter:blur(12px);

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.header-title{
    display:flex;
    align-items:center;
    gap:12px;
}

.header-title .symbol{
    font-size:30px;
}

.header-title h1{
    font-family:Georgia,serif;
    font-size:25px;
}

.header-actions{
    display:flex;
    gap:10px;
}

.header-actions button{
    border:1px solid rgba(255,255,255,.15);
    background:#17101e;
    color:white;
    padding:10px 15px;
    border-radius:9px;
    cursor:pointer;
    transition:.2s;
}

.header-actions button:hover{
    background:#271735;
}

.logout-button{
    color:#ff9da8 !important;
}

.container{
    width:min(1200px,94%);
    margin:35px auto;
}

.welcome{
    margin-bottom:25px;
}

.welcome h2{
    font-family:Georgia,serif;
    font-size:30px;
    margin-bottom:6px;
}

.welcome p{
    color:#b9a9c8;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:30px;
}

.stat-card{
    padding:23px;
    border-radius:15px;
    background:rgba(25,14,35,.85);
    border:1px solid rgba(190,130,255,.18);
}

.stat-card .label{
    color:#ae9dbd;
    font-size:14px;
    margin-bottom:8px;
}

.stat-card .number{
    font-size:34px;
    font-weight:bold;
}

.stat-card.total .number{
    color:#d2a4ff;
}

.stat-card.yes .number{
    color:#7ff0ad;
}

.stat-card.no .number{
    color:#ff8996;
}

.table-container{
    background:rgba(15,8,22,.9);
    border:1px solid rgba(190,130,255,.15);
    border-radius:16px;
    overflow:hidden;
}

.table-header{
    padding:20px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.table-header h3{
    font-family:Georgia,serif;
    font-size:21px;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    text-align:left;
    padding:15px;
    font-size:13px;
    color:#bdaecc;
    background:rgba(255,255,255,.025);
    border-bottom:1px solid rgba(255,255,255,.08);
}

td{
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,.06);
    color:#eee;
}

tr:last-child td{
    border-bottom:none;
}

tr:hover td{
    background:rgba(255,255,255,.025);
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.status.yes{
    background:rgba(50,200,110,.13);
    color:#78efa8;
    border:1px solid rgba(80,220,130,.2);
}

.status.no{
    background:rgba(255,60,80,.12);
    color:#ff8997;
    border:1px solid rgba(255,70,90,.2);
}

.delete-button{
    border:none;
    background:rgba(220,40,60,.12);
    color:#ff8d98;
    border:1px solid rgba(220,60,80,.2);
    padding:7px 11px;
    border-radius:7px;
    cursor:pointer;
}

.delete-button:hover{
    background:rgba(220,40,60,.25);
}

.loading{
    padding:45px;
    text-align:center;
    color:#bca9ca;
}

.empty{
    padding:50px 20px;
    text-align:center;
    color:#a998b7;
}

.empty-symbol{
    font-size:40px;
    margin-bottom:10px;
}

@media(max-width:700px){

    header{
        padding:18px;
        align-items:flex-start;
        flex-direction:column;
    }

    .header-actions{
        width:100%;
    }

    .header-actions button{
        flex:1;
    }

    .container{
        width:94%;
        margin:25px auto;
    }

    .welcome h2{
        font-size:25px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .stat-card{
        padding:18px;
    }

    .login-box{
        padding:30px 22px;
    }

}

</style>
</head>

<body>

<section class="login-screen" id="loginScreen">

    <div class="login-box">

        <div class="login-symbol">
            ✦
        </div>

        <h1>Administración</h1>

        <p>
            Panel privado de Velunara
        </p>

        <form id="loginForm">

            <div class="input-group">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Correo del administrador"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="input-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Iniciar sesión
            </button>

        </form>

        <div
            class="login-error"
            id="loginError"
        ></div>

    </div>

</section>


<section class="admin" id="adminPanel">

<header>

    <div class="header-title">

        <div class="symbol">
            ✦
        </div>

        <h1>
            Invitados
        </h1>

    </div>

    <div class="header-actions">

        <button id="refreshButton">
            ↻ Actualizar
        </button>

        <button
            id="logoutButton"
            class="logout-button"
        >
            Cerrar sesión
        </button>

    </div>

</header>


<div class="container">

    <div class="welcome">

        <h2>
            Panel de administración
        </h2>

        <p>
            Aquí aparecen las confirmaciones de asistencia.
        </p>

    </div>


    <div class="stats">

        <div class="stat-card total">

            <div class="label">
                Confirmaciones
            </div>

            <div
                class="number"
                id="totalGuests"
            >
                0
            </div>

        </div>


        <div class="stat-card yes">

            <div class="label">
                Personas que asistirán
            </div>

            <div
                class="number"
                id="totalAttending"
            >
                0
            </div>

        </div>


        <div class="stat-card no">

            <div class="label">
                Personas que no asistirán
            </div>

            <div
                class="number"
                id="totalNotAttending"
            >
                0
            </div>

        </div>

    </div>


    <div class="table-container">

        <div class="table-header">

            <h3>
                ✦ Lista de invitados
            </h3>

        </div>

        <div
            class="table-wrapper"
            id="tableArea"
        >

            <div class="loading">
                Cargando invitados...
            </div>

        </div>

    </div>

</div>

</section>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://ibdjtobuadgzozbggxxu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_QYI1nQKLZly1FHoSjgaqcg_xTS3WDSE";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   ELEMENTOS
========================= */

const loginScreen =
    document.getElementById("loginScreen");

const adminPanel =
    document.getElementById("adminPanel");

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const loginError =
    document.getElementById("loginError");

const logoutButton =
    document.getElementById("logoutButton");

const refreshButton =
    document.getElementById("refreshButton");

const tableArea =
    document.getElementById("tableArea");

const totalGuests =
    document.getElementById("totalGuests");

const totalAttending =
    document.getElementById("totalAttending");

const totalNotAttending =
    document.getElementById("totalNotAttending");


/* =========================
   CONTROL DE CARGAS
========================= */

let guestsLoaded = false;

let loadingGuests = false;


/* =========================
   ESCAPAR HTML
========================= */

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   MOSTRAR ADMIN
========================= */

function showAdmin(){

    loginScreen.style.display = "none";
    adminPanel.style.display = "block";

}


/* =========================
   MOSTRAR LOGIN
========================= */

function showLogin(){

    adminPanel.style.display = "none";
    loginScreen.style.display = "flex";

    guestsLoaded = false;

}


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        loginError.style.display = "none";

        loginButton.disabled = true;
        loginButton.textContent =
            "Iniciando sesión...";


        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        const {
            data,
            error
        } =
            await supabaseClient.auth
                .signInWithPassword({
                    email:email,
                    password:password
                });


        if(error){

            console.error(error);

            loginError.textContent =
                "Correo o contraseña incorrectos.";

            loginError.style.display =
                "block";

            loginButton.disabled =
                false;

            loginButton.textContent =
                "Iniciar sesión";

            return;
        }


        if(data.session){

            showAdmin();

            await loadGuestsOnce();

        }


        loginButton.disabled =
            false;

        loginButton.textContent =
            "Iniciar sesión";

    }
);


/* =========================
   CARGAR UNA SOLA VEZ
========================= */

async function loadGuestsOnce(){

    if(guestsLoaded || loadingGuests){
        return;
    }

    await loadGuests();

}


/* =========================
   CARGAR INVITADOS
========================= */

async function loadGuests(){

    if(loadingGuests){
        return;
    }

    loadingGuests = true;

    tableArea.innerHTML = `
        <div class="loading">
            Cargando invitados...
        </div>
    `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("confirmaciones")
            .select("*")
            .order("fecha",{
                ascending:false
            });


    loadingGuests = false;


    if(error){

        console.error(error);

        tableArea.innerHTML = `
            <div class="empty">

                <div class="empty-symbol">
                    ⚠
                </div>

                <div>
                    No se pudieron cargar las confirmaciones.
                </div>

            </div>
        `;

        return;
    }


    guestsLoaded = true;

    updateStats(data || []);

    renderGuests(data || []);

}


/* =========================
   ESTADÍSTICAS
========================= */

function updateStats(guests){

    const total =
        guests.length;

    let attending = 0;

    let notAttending = 0;


    guests.forEach(
        guest => {

            const people =
                Number(guest.personas) || 0;


            if(guest.asistencia === true){

                attending += people;

            }else{

                notAttending += people;

            }

        }
    );


    totalGuests.textContent =
        total;

    totalAttending.textContent =
        attending;

    totalNotAttending.textContent =
        notAttending;

}


/* =========================
   MOSTRAR INVITADOS
========================= */

function renderGuests(guests){

    if(!guests.length){

        tableArea.innerHTML = `
            <div class="empty">

                <div class="empty-symbol">
                    ✦
                </div>

                <div>
                    Todavía no hay confirmaciones.
                </div>

            </div>
        `;

        return;
    }


    let rows = "";


    guests.forEach(
        guest => {

            const date =
                guest.fecha
                    ? new Date(
                        guest.fecha
                    ).toLocaleString(
                        "es-MX",
                        {
                            dateStyle:"short",
                            timeStyle:"short"
                        }
                    )
                    : "Sin fecha";


            const attendance =
                guest.asistencia === true;


            rows += `

                <tr>

                    <td>
                        ${escapeHTML(
                            guest.nombre
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            guest.personas
                        )}
                    </td>

                    <td>

                        ${
                            attendance

                            ? `
                                <span class="status yes">
                                    SÍ ASISTE
                                </span>
                            `

                            : `
                                <span class="status no">
                                    NO ASISTE
                                </span>
                            `
                        }

                    </td>

                    <td>
                        ${
                            guest.telefono
                            ? escapeHTML(
                                guest.telefono
                            )
                            : "No proporcionado"
                        }
                    </td>

                    <td>
                        ${escapeHTML(date)}
                    </td>

                    <td>

                        <button
                            class="delete-button"
                            onclick="deleteGuest(${guest.id})"
                        >
                            Eliminar
                        </button>

                    </td>

                </tr>

            `;

        }
    );


    tableArea.innerHTML = `

        <table>

            <thead>

                <tr>

                    <th>Nombre</th>
                    <th>Personas</th>
                    <th>Asistencia</th>
                    <th>Teléfono</th>
                    <th>Fecha</th>
                    <th>Acción</th>

                </tr>

            </thead>

            <tbody>

                ${rows}

            </tbody>

        </table>

    `;

}


/* =========================
   ELIMINAR
========================= */

async function deleteGuest(id){

    const confirmDelete =
        confirm(
            "¿Seguro que quieres eliminar esta confirmación?"
        );


    if(!confirmDelete){
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("confirmaciones")
            .delete()
            .eq("id",id);


    if(error){

        console.error(error);

        alert(
            "No se pudo eliminar la confirmación."
        );

        return;
    }


    guestsLoaded = false;

    await loadGuests();

}


/* =========================
   ACTUALIZAR
========================= */

refreshButton.addEventListener(
    "click",
    async function(){

        if(loadingGuests){
            return;
        }

        guestsLoaded = false;

        await loadGuests();

    }
);


/* =========================
   CERRAR SESIÓN
========================= */

logoutButton.addEventListener(
    "click",
    async function(){

        await supabaseClient.auth.signOut();

        showLogin();

    }
);


/* =========================
   SESIÓN
========================= */

supabaseClient.auth.onAuthStateChange(
    function(event,session){

        if(session){

            showAdmin();

        }else{

            showLogin();

        }

    }
);


/* =========================
   INICIAR
========================= */

async function checkSession(){

    const {
        data
    } =
        await supabaseClient.auth
            .getSession();


    if(data.session){

        showAdmin();

        await loadGuestsOnce();

    }else{

        showLogin();

    }

}


checkSession();

</script>

</body>
</html>
