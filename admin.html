<style>

/* =========================
   GENERAL
========================= */

html,
body{

/* =========================
   LOGIN
========================= */

#loginScreen{

    position:relative;

    z-index:2;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

}

.login-box{

@keyframes loginAppear{

    }

    to{
        opacity:1;
        transform:

.login-title{

    margin:0;

            210,
            160,
            255,

        );
}

.login-subtitle{

    margin:

    color:#d9c5e5;

/* =========================
   CAMPOS
========================= */

.field{

    text-align:left;

    margin-bottom:18px;
}

.field label{

    display:block;

    margin-bottom:7px;

    font-size:14px;

}

.field input{

    padding:13px 14px;

}

.field input:focus{

    box-shadow:

/* =========================
   PASSWORD
========================= */

.password-wrapper{

    position:relative;

    width:100%;
}

.password-wrapper input{

    padding-right:50px;
}

.password-toggle{

    position:absolute;

    right:8px;

    top:50%;

    transform:
        translateY(-50%);

    height:38px;

    border:0;

}

.password-toggle:hover{

        rgba(
            255,
            255,

        );
}


/* =========================
   BOTÓN LOGIN
========================= */

.login-button{

    width:100%;

    margin-top:8px;

    padding:14px;

    border-radius:15px;

    border:
        1px solid

            237,

            135deg,

.login-button:hover{

#loginMessage{

/* =========================

========================= */

#adminScreen{

    position:relative;

    z-index:2;

    min-height:100vh;

    padding:
        30px
        25px
        60px;

/* =========================
   HEADER
========================= */

.admin-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    margin-bottom:30px;

    padding-bottom:20px;

        1px solid

            237,

        );
}

.admin-title{

    margin:0;

    font-family:
        "Cinzel Decorative",
        Georgia,
        serif;

    font-size:
        clamp(
            28px,

}

}

.header-actions{

    justify-content:flex-end;
}

.header-button{

        11px
        16px;

    border-radius:12px;

    border:
        1px solid
        rgba(
            214,
            177,
            237,
            .3
        );

    background:#211025;

    color:white;

    cursor:pointer;

}

.header-button:hover{

    background:#34203d;

}

}


/* =========================
   ESTADÍSTICAS
========================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(

        );

    gap:15px;

}

.stat-card{

    padding:22px;

        );
}

.stat-label{

}

/* =========================

========================= */

.table-card{

}

thead{

th,
td{

th{

    white-space:nowrap;
}

td{

    font-size:14px;

    color:#f2e9f5;
}

tbody tr{

    transition:
        background .2s ease;
}

tbody tr:hover{

    background:
        rgba(
            255,
            255,

        );
}


/* =========================
   ASISTENCIA
========================= */

.status{

    display:inline-block;

    padding:
        6px
        10px;

    border-radius:20px;

    font-size:12px;
}

.status.yes{

    background:
        rgba(
            60,
            170,
            90,

        );

    border:

        rgba(
            120,
            230,
            140,

        );
}

.status.no{

    background:
        rgba(
            200,

            70,

        );

            120,

        );

/* =========================
   ELIMINAR
========================= */

.delete-button{

        7px

/* =========================

        20px;

<body>


<!-- =========================
     LOGIN
========================= -->

<section
    id="loginScreen">

    <div class="login-box">

        <h1 class="login-title">
            VELUNARA
        </h1>

        <div class="login-subtitle">
            Panel de administración
        </div>


        <form id="loginForm">

            <div class="field">

                <label for="email">
                    Correo
                </label>

                <input
                    type="email"
                    id="email"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Contraseña
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        required
                    >

                    <button

                        id="togglePassword"
                        class="password-toggle"
                        aria-label="Mostrar contraseña"

                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-button"
                id="loginButton">

                id="loginMessage">
            </div>

        </form>

    </div>

</section>


<!-- =========================
     ADMIN
========================= -->

<section
    id="adminScreen"
    class="hidden">

    <div class="admin-container">


        <!-- HEADER -->

        <header class="admin-header">

            <div>

                <h1 class="admin-title">
                    VELUNARA
                </h1>

                <div class="admin-subtitle">
                    Confirmaciones de asistencia
                </div>

            </div>


            <div class="header-actions">

                <button
                    type="button"
                    class="header-button"
                    id="refreshButton">

                    ↻ ACTUALIZAR

                </button>

                <button
                    type="button"
                    class="header-button"
                    id="logoutButton">

                    CERRAR SESIÓN

                </button>

            </div>

        </header>


        <!-- ESTADÍSTICAS -->

        <section class="stats">


            <div class="stat-card">

                <div class="stat-label">
                    Confirmaciones
                </div>

                <div
                    class="stat-number"
                    id="totalConfirmaciones">

                    0

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Personas que asistirán
                </div>

                <div
                    class="stat-number"
                    id="totalAsistiran">

                    0

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Personas que no asistirán
                </div>

                <div
                    class="stat-number"
                    id="totalNoAsistiran">

                    0

                </div>

            </div>


        </section>


        <!-- TABLA -->

        <section class="table-card">

            <div class="table-title">

            </div>

                <table>

                    <thead>

                        <tr>

                            <th>
                                Nombre
                            </th>

                            <th>
                                Personas
                            </th>

                            <th>
                                Asistencia
                            </th>

                            <th>
                                Teléfono
                            </th>

                            <th>
                                Fecha
                            </th>

                            <th>
                                Acción
                            </th>

                        </tr>

                    </thead>

                    <tbody
                        id="guestTableBody">
                    </tbody>

                </table>

            </div>

            <div
                id="emptyMessage"
                class="empty hidden">

                No hay confirmaciones todavía.

            </div>

<script>

/* =========================
   ESPERAR SUPABASE
========================= */

window.addEventListener(
    "load",
    init
);


/* =========================
   CONFIGURACIÓN
========================= */

const SUPABASE_URL =
    "https://ibdjtobuadgzozbggxxu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_QYI1nQKLZly1FHoSjgaqcg_xTS3WDSE";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true
            }
        }
    );


/* =========================
   ELEMENTOS
========================= */

const loginScreen =
    document.getElementById(
        "loginScreen"
    );

const adminScreen =
    document.getElementById(
        "adminScreen"
    );

const loginForm =
    document.getElementById(
        "loginForm"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const loginMessage =
    document.getElementById(
        "loginMessage"
    );

const togglePassword =
    document.getElementById(
        "togglePassword"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const refreshButton =
    document.getElementById(
        "refreshButton"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );

const guestTableBody =
    document.getElementById(
        "guestTableBody"
    );

const emptyMessage =
    document.getElementById(
        "emptyMessage"
    );

const adminMessage =
    document.getElementById(
        "adminMessage"
    );

const totalConfirmaciones =
    document.getElementById(
        "totalConfirmaciones"
    );

const totalAsistiran =
    document.getElementById(
        "totalAsistiran"
    );

const totalNoAsistiran =
    document.getElementById(
        "totalNoAsistiran"
    );


/* =========================
   ESTADO
========================= */

let loadingGuests = false;


/* =========================
   MOSTRAR LOGIN
========================= */

function showLogin(){

    loginScreen.classList.remove(
        "hidden"
    );

    adminScreen.classList.add(
        "hidden"
    );

}


/* =========================
   MOSTRAR ADMIN
========================= */

function showAdmin(){

    loginScreen.classList.add(
        "hidden"
    );

    adminScreen.classList.remove(
        "hidden"
    );

}


/* =========================
   MOSTRAR / OCULTAR PASSWORD
========================= */

togglePassword.addEventListener(
    "click",
    () => {

        const showing =
            passwordInput.type ===
            "text";

        passwordInput.type =
            showing
                ? "password"
                : "text";

        togglePassword.textContent =
            showing
                ? "👁️"
                : "🙈";

        togglePassword.setAttribute(
            "aria-label",
            showing
                ? "Mostrar contraseña"
                : "Ocultar contraseña"
        );

    }
);


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        loginMessage.textContent = "";

        loginButton.disabled = true;

        loginButton.textContent =
            "INICIANDO SESIÓN...";


        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            passwordInput.value;


        try{

            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .signInWithPassword({
                        email,
                        password
                    });


            if(error){

                console.error(
                    "ERROR LOGIN:",
                    error
                );

                loginMessage.textContent =
                    "Correo o contraseña incorrectos.";

                return;

            }


            if(data.session){

                showAdmin();

                await loadGuests();

            }


        }catch(error){

            console.error(
                "ERROR:",
                error
            );

            loginMessage.textContent =
                "No se pudo iniciar sesión.";

        }finally{

            loginButton.disabled =
                false;

            loginButton.textContent =
                "🔐 INICIAR SESIÓN";

        }

    }
);


/* =========================
   CARGAR CONFIRMACIONES
========================= */

async function loadGuests(){

    if(loadingGuests){
        return;
    }

    loadingGuests = true;

    refreshButton.disabled = true;

    refreshButton.textContent =
        "↻ CARGANDO...";

    adminMessage.textContent = "";

    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from("confirmaciones")
                .select(
                    "id,nombre,personas,asistencia,telefono,fecha"
                )
                .order(
                    "fecha",
                    {
                        ascending:false
                    }
                );


        if(error){

            console.error(
                "ERROR AL CARGAR:",
                error
            );

            adminMessage.textContent =
                "No se pudieron cargar las confirmaciones.";

            adminMessage.style.color =
                "#ff9b9b";

            return;

        }


        const guests =
            data || [];


        renderGuests(
            guests
        );


    }catch(error){

        console.error(
            "ERROR:",
            error
        );

        adminMessage.textContent =
            "Ocurrió un error al cargar los datos.";

        adminMessage.style.color =
            "#ff9b9b";

    }finally{

        loadingGuests = false;

        refreshButton.disabled =
            false;

        refreshButton.textContent =
            "↻ ACTUALIZAR";

    }

}


/* =========================
   MOSTRAR TABLA
========================= */

function renderGuests(
    guests
){

    guestTableBody.replaceChildren();


    if(
        !guests ||
        guests.length === 0
    ){

        emptyMessage.classList.remove(
            "hidden"
        );

    }else{

        emptyMessage.classList.add(
            "hidden"
        );

    }


    let confirmaciones = 0;

    let personasAsistiran = 0;

    let personasNoAsistiran = 0;


    guests.forEach(
        guest => {

            confirmaciones++;


            const personas =
                Number(
                    guest.personas
                ) || 0;


            if(guest.asistencia){

                personasAsistiran +=
                    personas;

            }else{

                personasNoAsistiran +=
                    personas;

            }


            const row =
                document.createElement(
                    "tr"
                );


            /* NOMBRE */

            const nameCell =
                document.createElement(
                    "td"
                );

            nameCell.textContent =
                guest.nombre || "";

            row.appendChild(
                nameCell
            );


            /* PERSONAS */

            const peopleCell =
                document.createElement(
                    "td"
                );

            peopleCell.textContent =
                String(personas);

            row.appendChild(
                peopleCell
            );


            /* ASISTENCIA */

            const attendanceCell =
                document.createElement(
                    "td"
                );

            const status =
                document.createElement(
                    "span"
                );

            status.classList.add(
                "status",
                guest.asistencia
                    ? "yes"
                    : "no"
            );

            status.textContent =
                guest.asistencia
                    ? "Sí asistirá"
                    : "No asistirá";

            attendanceCell.appendChild(
                status
            );

            row.appendChild(
                attendanceCell
            );


            /* TELÉFONO */

            const phoneCell =
                document.createElement(
                    "td"
                );

            phoneCell.textContent =
                guest.telefono ||
                "No proporcionado";

            row.appendChild(
                phoneCell
            );


            /* FECHA */

            const dateCell =
                document.createElement(
                    "td"
                );

            if(guest.fecha){

                const date =
                    new Date(
                        guest.fecha
                    );

                dateCell.textContent =
                    date.toLocaleString(
                        "es-MX",
                        {
                            dateStyle:
                                "short",
                            timeStyle:
                                "short"
                        }
                    );

            }else{

                dateCell.textContent =
                    "Sin fecha";

            }

            row.appendChild(
                dateCell
            );


            /* ACCIÓN */

            const actionCell =
                document.createElement(
                    "td"
                );


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.type =
                "button";

            deleteButton.className =
                "delete-button";

            deleteButton.textContent =
                "ELIMINAR";


            deleteButton.addEventListener(
                "click",
                () => {

                    deleteGuest(
                        guest.id,
                        guest.nombre
                    );

                }
            );


            actionCell.appendChild(
                deleteButton
            );

            row.appendChild(
                actionCell
            );


            guestTableBody.appendChild(
                row
            );

        }
    );


    totalConfirmaciones.textContent =
        String(
            confirmaciones
        );

    totalAsistiran.textContent =
        String(
            personasAsistiran
        );

    totalNoAsistiran.textContent =
        String(
            personasNoAsistiran
        );

}


/* =========================
   ELIMINAR
========================= */

async function deleteGuest(
    id,
    nombre
){

    const confirmar =
        window.confirm(
            "¿Eliminar la confirmación de " +
            nombre +
            "?"
        );


    if(!confirmar){
        return;
    }


    adminMessage.textContent =
        "Eliminando...";

    adminMessage.style.color =
        "#e8d6f0";


    try{

        const {
            error
        } =
            await supabaseClient
                .from("confirmaciones")
                .delete()
                .eq(
                    "id",
                    id
                );


        if(error){

            console.error(
                "ERROR AL ELIMINAR:",
                error
            );

            adminMessage.textContent =
                "No se pudo eliminar la confirmación.";

            adminMessage.style.color =
                "#ff9b9b";

            return;

        }


        adminMessage.textContent =
            "Confirmación eliminada.";

        adminMessage.style.color =
            "#c8ffcf";


        await loadGuests();


        setTimeout(
            () => {

                adminMessage.textContent =
                    "";

            },
            2000
        );


    }catch(error){

        console.error(
            "ERROR:",
            error
        );

        adminMessage.textContent =
            "Ocurrió un error al eliminar.";

        adminMessage.style.color =
            "#ff9b9b";

    }

}


/* =========================
   ACTUALIZAR
========================= */

refreshButton.addEventListener(
    "click",
    loadGuests
);


/* =========================
   CERRAR SESIÓN
========================= */

logoutButton.addEventListener(
    "click",
    async () => {

        await supabaseClient.auth.signOut();

        showLogin();

    }
);


/* =========================
   CAMBIOS DE AUTENTICACIÓN
========================= */

supabaseClient.auth.onAuthStateChange(
    (
        event,
        session
    ) => {

        if(session){

            showAdmin();

        }else{

            showLogin();

        }

    }
);


/* =========================
   INICIO
========================= */

async function init(){

    try{

        const {
            data
        } =
            await supabaseClient.auth
                .getSession();


        if(data.session){

            showAdmin();

            await loadGuests();

        }else{

            showLogin();

        }

    }catch(error){

        console.error(
            "ERROR DE INICIO:",
            error
        );

        showLogin();

    }

}

</script>
