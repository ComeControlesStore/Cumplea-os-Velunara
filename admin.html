<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="robots"
    content="noindex,nofollow,noarchive"
>

<title>Administración | Velunara</title>

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    defer
></script>

<style>

/* =========================================================
   GENERAL
========================================================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    background:
        radial-gradient(
            circle at top,
            #30154b 0%,
            #160b24 45%,
            #09050d 100%
        );

    color:#fff;
    font-family:Arial,sans-serif;
}

.hidden{
    display:none !important;
}


/* =========================================================
   LOGIN
========================================================= */

.login-screen{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;

    padding:35px;

    border-radius:20px;

    background:rgba(20,10,30,.94);

    border:1px solid
        rgba(220,170,255,.25);

    box-shadow:
        0 20px 60px rgba(0,0,0,.55);
}

.login-box h1{
    margin:0 0 8px;

    text-align:center;

    font-family:Georgia,serif;

    color:#e8c8ff;
}

.login-box p{
    margin:0 0 25px;

    text-align:center;

    color:#c9b9d4;
}


/* =========================================================
   INPUTS
========================================================= */

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;

    margin-bottom:7px;

    color:#ddd;

    font-size:14px;
}

.input-group input{
    width:100%;

    padding:13px;

    border-radius:10px;

    border:1px solid #604675;

    background:#110817;

    color:#fff;

    outline:none;
}

.input-group input:focus{
    border-color:#c99aff;
}


/* =========================================================
   CONTRASEÑA + OJITO
========================================================= */

.password-wrapper{
    position:relative;

    width:100%;
}

.password-wrapper input{
    padding-right:55px;
}

.password-toggle{
    position:absolute;

    top:50%;
    right:7px;

    transform:translateY(-50%);

    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0;

    border:0;
    border-radius:8px;

    background:transparent;

    color:#fff;

    font-size:18px;

    cursor:pointer;

    user-select:none;
}

.password-toggle:hover{
    background:rgba(255,255,255,.08);
}

.password-toggle:focus{
    outline:2px solid #c99aff;

    outline-offset:1px;
}


/* =========================================================
   BOTÓN LOGIN
========================================================= */

.login-button{
    width:100%;

    padding:14px;

    border:0;
    border-radius:10px;

    background:#8e4fc4;

    color:white;

    font-weight:bold;

    cursor:pointer;
}

.login-button:hover{
    background:#a968dd;
}

.login-button:disabled{
    opacity:.6;

    cursor:not-allowed;
}

.login-message{
    min-height:22px;

    margin-top:14px;

    text-align:center;

    color:#ff9b9b;
}


/* =========================================================
   ADMIN
========================================================= */

.admin-screen{
    min-height:100vh;

    padding:20px;
}

.admin-container{
    width:100%;
    max-width:1250px;

    margin:auto;
}


/* =========================================================
   HEADER
========================================================= */

.admin-header{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:15px;

    margin-bottom:25px;

    padding:20px;

    border-radius:18px;

    background:rgba(20,10,30,.9);

    border:1px solid
        rgba(220,170,255,.18);
}

.admin-header h1{
    margin:0;

    font-family:Georgia,serif;

    color:#e8c8ff;
}

.admin-actions{
    display:flex;

    gap:10px;

    flex-wrap:wrap;
}

.admin-actions button{
    border:1px solid #75558a;

    border-radius:9px;

    padding:10px 15px;

    background:#1b1024;

    color:#fff;

    cursor:pointer;
}

.admin-actions button:hover{
    background:#2d183c;
}

.admin-actions button:disabled{
    opacity:.6;

    cursor:not-allowed;
}


/* =========================================================
   ESTADÍSTICAS
========================================================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:15px;

    margin-bottom:25px;
}

.stat-card{
    padding:22px;

    border-radius:16px;

    background:rgba(20,10,30,.9);

    border:1px solid
        rgba(220,170,255,.18);
}

.stat-card h2{
    margin:0 0 8px;

    font-size:15px;

    color:#cbb8d7;

    font-weight:normal;
}

.stat-number{
    font-size:32px;

    font-weight:bold;

    color:#efd9ff;
}


/* =========================================================
   TABLA
========================================================= */

.table-container{
    overflow-x:auto;

    border-radius:16px;

    background:rgba(20,10,30,.9);

    border:1px solid
        rgba(220,170,255,.18);
}

table{
    width:100%;

    min-width:950px;

    border-collapse:collapse;
}

thead{
    background:#251334;
}

th,
td{
    padding:14px 12px;

    text-align:left;

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

th{
    color:#e7cfff;

    font-size:14px;
}

td{
    color:#eee;

    font-size:14px;
}

tbody tr:hover{
    background:
        rgba(255,255,255,.035);
}

.attending{
    color:#9dffb2;

    font-weight:bold;
}

.not-attending{
    color:#ff9b9b;

    font-weight:bold;
}

.delete-button{
    border:0;

    border-radius:7px;

    padding:8px 11px;

    background:#8e3030;

    color:#fff;

    cursor:pointer;
}

.delete-button:hover{
    background:#a83b3b;
}

.delete-button:disabled{
    opacity:.5;

    cursor:not-allowed;
}


/* =========================================================
   MENSAJE VACÍO
========================================================= */

.empty-message{
    padding:35px;

    text-align:center;

    color:#b9a9c4;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px){

    .stats{
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

}

@media(max-width:750px){

    .admin-screen{
        padding:10px;
    }

    .admin-header{
        flex-direction:column;

        align-items:stretch;
    }

    .admin-header h1{
        text-align:center;
    }

    .admin-actions{
        justify-content:center;
    }

    .admin-actions button{
        flex:1;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .login-box{
        padding:25px 20px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section
    id="loginScreen"
    class="login-screen"
>

    <div class="login-box">

        <h1>
            Administración
        </h1>

        <p>
            Acceso privado de Velunara
        </p>


        <form id="loginForm">


            <!-- CORREO -->

            <div class="input-group">

                <label for="email">
                    Correo
                </label>

                <input
                    type="email"
                    id="email"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- CONTRASEÑA -->

            <div class="input-group">

                <label for="password">
                    Contraseña
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                        aria-label="Mostrar contraseña"
                        title="Mostrar contraseña"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                INICIAR SESIÓN
            </button>


            <div
                class="login-message"
                id="loginMessage"
            ></div>


        </form>

    </div>

</section>


<!-- =====================================================
     ADMIN
===================================================== -->

<section
    id="adminScreen"
    class="admin-screen hidden"
>

    <div class="admin-container">


        <!-- HEADER -->

        <header class="admin-header">

            <h1>
                💜 Confirmaciones
            </h1>


            <div class="admin-actions">

                <button
                    type="button"
                    id="refreshButton"
                >
                    ↻ Actualizar
                </button>


                <button
                    type="button"
                    id="logoutButton"
                >
                    Cerrar sesión
                </button>

            </div>

        </header>


        <!-- ESTADÍSTICAS -->

        <section class="stats">


            <!-- CONFIRMACIONES -->

            <div class="stat-card">

                <h2>
                    Confirmaciones
                </h2>

                <div
                    class="stat-number"
                    id="totalConfirmaciones"
                >
                    0
                </div>

            </div>


            <!-- NIÑOS QUE ASISTIRÁN -->

            <div class="stat-card">

                <h2>
                    Niños que asistirán
                </h2>

                <div
                    class="stat-number"
                    id="totalNinosAsistiran"
                >
                    0
                </div>

            </div>


            <!-- ADULTOS QUE ASISTIRÁN -->

            <div class="stat-card">

                <h2>
                    Adultos que asistirán
                </h2>

                <div
                    class="stat-number"
                    id="totalAdultosAsistiran"
                >
                    0
                </div>

            </div>


            <!-- NIÑOS QUE NO ASISTIRÁN -->

            <div class="stat-card">

                <h2>
                    Niños que no asistirán
                </h2>

                <div
                    class="stat-number"
                    id="totalNinosNoAsistiran"
                >
                    0
                </div>

            </div>


            <!-- ADULTOS QUE NO ASISTIRÁN -->

            <div class="stat-card">

                <h2>
                    Adultos que no asistirán
                </h2>

                <div
                    class="stat-number"
                    id="totalAdultosNoAsistiran"
                >
                    0
                </div>

            </div>


        </section>


        <!-- TABLA -->

        <section class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Nombre
                        </th>

                        <th>
                            Niños
                        </th>

                        <th>
                            Adultos
                        </th>

                        <th>
                            Asistencia
                        </th>

                        <th>
                            Teléfono
                        </th>

                        <th>
                            Fecha
                        </th>

                        <th>
                            Acción
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="guestsTableBody"
                ></tbody>

            </table>


            <div
                id="emptyMessage"
                class="empty-message hidden"
            >
                No hay confirmaciones registradas.
            </div>

        </section>


    </div>

</section>


<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {


        /* =================================================
           CONFIGURACIÓN SUPABASE
        ================================================= */

        const SUPABASE_URL =
            "https://ibdjtobuadgzozbggxxu.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_QYI1nQKLZly1FHoSjgaqcg_xTS3WDSE";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY,
                {
                    auth:{
                        persistSession:true,
                        autoRefreshToken:true,
                        detectSessionInUrl:true
                    }
                }
            );


        /* =================================================
           ELEMENTOS
        ================================================= */

        const loginScreen =
            document.getElementById(
                "loginScreen"
            );

        const adminScreen =
            document.getElementById(
                "adminScreen"
            );

        const loginForm =
            document.getElementById(
                "loginForm"
            );

        const loginButton =
            document.getElementById(
                "loginButton"
            );

        const loginMessage =
            document.getElementById(
                "loginMessage"
            );

        const refreshButton =
            document.getElementById(
                "refreshButton"
            );

        const logoutButton =
            document.getElementById(
                "logoutButton"
            );

        const guestsTableBody =
            document.getElementById(
                "guestsTableBody"
            );

        const emptyMessage =
            document.getElementById(
                "emptyMessage"
            );

        const totalConfirmaciones =
            document.getElementById(
                "totalConfirmaciones"
            );

        const totalNinosAsistiran =
            document.getElementById(
                "totalNinosAsistiran"
            );

        const totalAdultosAsistiran =
            document.getElementById(
                "totalAdultosAsistiran"
            );

        const totalNinosNoAsistiran =
            document.getElementById(
                "totalNinosNoAsistiran"
            );

        const totalAdultosNoAsistiran =
            document.getElementById(
                "totalAdultosNoAsistiran"
            );

        const passwordInput =
            document.getElementById(
                "password"
            );

        const togglePassword =
            document.getElementById(
                "togglePassword"
            );


        /* =================================================
           ESTADO
        ================================================= */

        let loadingGuests = false;

        let currentGuests = [];

        let sessionActive = false;


        /* =================================================
           MOSTRAR / OCULTAR CONTRASEÑA
        ================================================= */

        togglePassword.addEventListener(
            "click",
            () => {

                const showing =
                    passwordInput.type === "text";


                if(showing){

                    passwordInput.type =
                        "password";

                    togglePassword.textContent =
                        "👁️";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Mostrar contraseña"
                    );

                    togglePassword.setAttribute(
                        "title",
                        "Mostrar contraseña"
                    );

                }
                else{

                    passwordInput.type =
                        "text";

                    togglePassword.textContent =
                        "🙈";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Ocultar contraseña"
                    );

                    togglePassword.setAttribute(
                        "title",
                        "Ocultar contraseña"
                    );

                }

            }
        );


        /* =================================================
           MOSTRAR LOGIN
        ================================================= */

        function showLogin(){

            sessionActive =
                false;

            currentGuests =
                [];


            loginScreen.classList.remove(
                "hidden"
            );

            adminScreen.classList.add(
                "hidden"
            );


            guestsTableBody.innerHTML =
                "";

            emptyMessage.classList.add(
                "hidden"
            );


            updateStats(
                []
            );

        }


        /* =================================================
           MOSTRAR ADMIN
        ================================================= */

        function showAdmin(){

            sessionActive =
                true;

            loginScreen.classList.add(
                "hidden"
            );

            adminScreen.classList.remove(
                "hidden"
            );

        }


        /* =================================================
           LOGIN
        ================================================= */

        loginForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                loginMessage.textContent =
                    "";


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    passwordInput.value;


                if(
                    !email ||
                    !password
                ){

                    loginMessage.textContent =
                        "Completa todos los campos.";

                    return;

                }


                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "INICIANDO...";


                try{

                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signInWithPassword({
                                email,
                                password
                            });


                    if(
                        error ||
                        !data.session
                    ){

                        console.error(
                            "ERROR DE LOGIN:",
                            error
                        );

                        loginMessage.textContent =
                            "Correo o contraseña incorrectos.";

                        return;

                    }


                    loginForm.reset();


                    passwordInput.type =
                        "password";

                    togglePassword.textContent =
                        "👁️";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Mostrar contraseña"
                    );

                    togglePassword.setAttribute(
                        "title",
                        "Mostrar contraseña"
                    );


                    showAdmin();

                    await loadGuests();


                }
                catch(error){

                    console.error(
                        "ERROR:",
                        error
                    );

                    loginMessage.textContent =
                        "No se pudo iniciar sesión.";

                }
                finally{

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "INICIAR SESIÓN";

                }

            }
        );


        /* =================================================
           CARGAR CONFIRMACIONES
        ================================================= */

        async function loadGuests(){

            if(
                loadingGuests ||
                !sessionActive
            ){

                return;

            }


            loadingGuests =
                true;

            refreshButton.disabled =
                true;

            refreshButton.textContent =
                "↻ Cargando...";


            try{

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("confirmaciones")
                        .select(
                            "id,nombre,ninos,adultos,asistencia,telefono,fecha"
                        )
                        .order(
                            "fecha",
                            {
                                ascending:false
                            }
                        );


                if(error){

                    console.error(
                        "ERROR CARGANDO CONFIRMACIONES:",
                        error
                    );


                    currentGuests =
                        [];


                    guestsTableBody.innerHTML =
                        "";


                    emptyMessage.classList.remove(
                        "hidden"
                    );


                    emptyMessage.textContent =
                        "No se pudieron cargar las confirmaciones.";


                    updateStats(
                        []
                    );


                    return;

                }


                currentGuests =
                    Array.isArray(data)
                        ? data
                        : [];


                renderGuests(
                    currentGuests
                );


                updateStats(
                    currentGuests
                );


            }
            catch(error){

                console.error(
                    "ERROR:",
                    error
                );


                currentGuests =
                    [];


                guestsTableBody.innerHTML =
                    "";


                emptyMessage.classList.remove(
                    "hidden"
                );


                emptyMessage.textContent =
                    "No se pudieron cargar las confirmaciones.";


                updateStats(
                    []
                );

            }
            finally{

                loadingGuests =
                    false;

                refreshButton.disabled =
                    false;

                refreshButton.textContent =
                    "↻ Actualizar";

            }

        }


        /* =================================================
           ESTADÍSTICAS
        ================================================= */

        function updateStats(
            guests
        ){

            let ninosAsistiran =
                0;

            let adultosAsistiran =
                0;

            let ninosNoAsistiran =
                0;

            let adultosNoAsistiran =
                0;


            for(
                const guest of guests
            ){

                const ninos =
                    Number(
                        guest.ninos
                    ) || 0;


                const adultos =
                    Number(
                        guest.adultos
                    ) || 0;


                if(
                    guest.asistencia === true
                ){

                    ninosAsistiran +=
                        ninos;

                    adultosAsistiran +=
                        adultos;

                }
                else{

                    ninosNoAsistiran +=
                        ninos;

                    adultosNoAsistiran +=
                        adultos;

                }

            }


            totalConfirmaciones.textContent =
                guests.length;


            totalNinosAsistiran.textContent =
                ninosAsistiran;


            totalAdultosAsistiran.textContent =
                adultosAsistiran;


            totalNinosNoAsistiran.textContent =
                ninosNoAsistiran;


            totalAdultosNoAsistiran.textContent =
                adultosNoAsistiran;

        }


        /* =================================================
           FORMATEAR FECHA
        ================================================= */

        function formatDate(
            value
        ){

            if(!value){

                return "Sin fecha";

            }


            const date =
                new Date(value);


            if(
                Number.isNaN(
                    date.getTime()
                )
            ){

                return "Fecha inválida";

            }


            return date.toLocaleString(
                "es-MX",
                {
                    dateStyle:"medium",
                    timeStyle:"short"
                }
            );

        }


        /* =================================================
           RENDERIZAR TABLA
           Se usa textContent para evitar XSS.
        ================================================= */

        function renderGuests(
            guests
        ){

            guestsTableBody.innerHTML =
                "";


            if(!guests.length){

                emptyMessage.classList.remove(
                    "hidden"
                );

                emptyMessage.textContent =
                    "No hay confirmaciones registradas.";

                return;

            }


            emptyMessage.classList.add(
                "hidden"
            );


            for(
                const guest of guests
            ){

                const row =
                    document.createElement(
                        "tr"
                    );


                /* NOMBRE */

                const nameCell =
                    document.createElement(
                        "td"
                    );

                nameCell.textContent =
                    guest.nombre || "";

                row.appendChild(
                    nameCell
                );


                /* NIÑOS */

                const childrenCell =
                    document.createElement(
                        "td"
                    );

                childrenCell.textContent =
                    String(
                        Number(
                            guest.ninos
                        ) || 0
                    );

                row.appendChild(
                    childrenCell
                );


                /* ADULTOS */

                const adultsCell =
                    document.createElement(
                        "td"
                    );

                adultsCell.textContent =
                    String(
                        Number(
                            guest.adultos
                        ) || 0
                    );

                row.appendChild(
                    adultsCell
                );


                /* ASISTENCIA */

                const attendanceCell =
                    document.createElement(
                        "td"
                    );


                if(
                    guest.asistencia === true
                ){

                    attendanceCell.textContent =
                        "Sí, asistirá";

                    attendanceCell.className =
                        "attending";

                }
                else{

                    attendanceCell.textContent =
                        "No asistirá";

                    attendanceCell.className =
                        "not-attending";

                }


                row.appendChild(
                    attendanceCell
                );


                /* TELÉFONO */

                const phoneCell =
                    document.createElement(
                        "td"
                    );

                phoneCell.textContent =
                    guest.telefono ||
                    "No indicado";

                row.appendChild(
                    phoneCell
                );


                /* FECHA */

                const dateCell =
                    document.createElement(
                        "td"
                    );

                dateCell.textContent =
                    formatDate(
                        guest.fecha
                    );

                row.appendChild(
                    dateCell
                );


                /* ACCIÓN */

                const actionCell =
                    document.createElement(
                        "td"
                    );


                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.type =
                    "button";

                deleteButton.className =
                    "delete-button";

                deleteButton.textContent =
                    "Eliminar";


                deleteButton.addEventListener(
                    "click",
                    () => {

                        deleteGuest(
                            guest.id,
                            deleteButton
                        );

                    }
                );


                actionCell.appendChild(
                    deleteButton
                );


                row.appendChild(
                    actionCell
                );


                guestsTableBody.appendChild(
                    row
                );

            }

        }


        /* =================================================
           ELIMINAR CONFIRMACIÓN
        ================================================= */

        async function deleteGuest(
            id,
            button
        ){

            if(
                !sessionActive ||
                !id
            ){

                return;

            }


            const confirmed =
                window.confirm(
                    "¿Seguro que quieres eliminar esta confirmación?"
                );


            if(!confirmed){

                return;

            }


            button.disabled =
                true;

            button.textContent =
                "Eliminando...";


            try{

                const {
                    error
                } =
                    await supabaseClient
                        .from("confirmaciones")
                        .delete()
                        .eq(
                            "id",
                            id
                        );


                if(error){

                    console.error(
                        "ERROR ELIMINANDO:",
                        error
                    );


                    window.alert(
                        "No se pudo eliminar la confirmación."
                    );


                    button.disabled =
                        false;

                    button.textContent =
                        "Eliminar";


                    return;

                }


                await loadGuests();


            }
            catch(error){

                console.error(
                    "ERROR:",
                    error
                );


                window.alert(
                    "Ocurrió un error al eliminar."
                );


                button.disabled =
                    false;

                button.textContent =
                    "Eliminar";

            }

        }


        /* =================================================
           ACTUALIZAR
        ================================================= */

        refreshButton.addEventListener(
            "click",
            () => {

                loadGuests();

            }
        );


        /* =================================================
           CERRAR SESIÓN
        ================================================= */

        logoutButton.addEventListener(
            "click",
            async () => {

                logoutButton.disabled =
                    true;


                try{

                    const {
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signOut();


                    if(error){

                        console.error(
                            "ERROR CERRANDO SESIÓN:",
                            error
                        );

                    }

                }
                finally{

                    showLogin();

                    logoutButton.disabled =
                        false;

                }

            }
        );


        /* =================================================
           CAMBIOS DE AUTENTICACIÓN
        ================================================= */

        supabaseClient
            .auth
            .onAuthStateChange(
                (
                    event,
                    session
                ) => {

                    if(session){

                        showAdmin();

                    }
                    else{

                        showLogin();

                    }

                }
            );


        /* =================================================
           COMPROBAR SESIÓN EXISTENTE
        ================================================= */

        async function init(){

            try{

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .getSession();


                if(error){

                    console.error(
                        "ERROR OBTENIENDO SESIÓN:",
                        error
                    );

                    showLogin();

                    return;

                }


                if(data.session){

                    showAdmin();

                    await loadGuests();

                }
                else{

                    showLogin();

                }

            }
            catch(error){

                console.error(
                    "ERROR:",
                    error
                );

                showLogin();

            }

        }


        /* =================================================
           INICIAR
        ================================================= */

        init();

    }
);

</script>

</body>
</html>
