
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administración | Velunara</title>

<meta name="robots" content="noindex,nofollow,noarchive">

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:#08030c;
    color:#f5eefe;
    font-family:Georgia,"Times New Roman",serif;
    overflow-x:hidden;
}

body::before,
body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
}

body::before{
    background:
        radial-gradient(circle at 15% 20%,rgba(151,76,255,.15),transparent 25%),
        radial-gradient(circle at 85% 70%,rgba(100,40,180,.12),transparent 25%);
}

body::after{
    opacity:.55;
    background-image:
        radial-gradient(circle,#fff 1px,transparent 1px),
        radial-gradient(circle,#c89cff 1px,transparent 1px);
    background-size:95px 95px,145px 145px;
    background-position:10px 20px,50px 70px;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.loginBox{
    width:100%;
    max-width:360px;
    padding:28px 24px;
    text-align:center;
    border:1px solid rgba(190,125,255,.45);
    border-radius:16px;
    background:rgba(15,6,24,.94);
    box-shadow:
        0 0 30px rgba(143,65,255,.18),
        inset 0 0 20px rgba(150,70,255,.04);
}

.loginSymbol{
    font-size:30px;
    margin-bottom:8px;
}

.loginBox h1{
    margin:0 0 6px;
    font-size:24px;
    color:#dfbdff;
}

.loginBox p{
    margin:0 0 18px;
    color:#bfa9cb;
    font-size:13px;
}

.loginBox input{
    width:100%;
    padding:11px 12px;
    margin-bottom:8px;
    border:1px solid #70419b;
    border-radius:8px;
    outline:none;
    background:#0b0610;
    color:white;
    font-family:inherit;
    font-size:14px;
}

.loginBox input:focus{
    border-color:#b77aff;
    box-shadow:0 0 8px rgba(183,122,255,.2);
}

.loginBox button{
    width:100%;
    margin-top:4px;
    padding:11px;
    border:1px solid #8d58bd;
    border-radius:8px;
    background:linear-gradient(135deg,#3b155c,#6b2c91);
    color:white;
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
}

.loginBox button:hover{
    background:linear-gradient(135deg,#512071,#7c35a5);
}

.loginBox button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#errorLogin{
    min-height:18px;
    margin-top:10px;
    color:#ff9d9d;
    font-size:12px;
}

/* =========================
   ADMIN
========================= */

#adminApp{
    display:none;
    width:100%;
    max-width:1180px;
    margin:auto;
    padding:18px 14px 30px;
}

.adminHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:18px;
    padding:12px 15px;
    border:1px solid rgba(180,115,240,.28);
    border-radius:12px;
    background:rgba(18,7,29,.82);
}

.adminTitle{
    display:flex;
    align-items:center;
    gap:9px;
}

.adminTitle .symbol{
    font-size:24px;
}

.adminTitle h1{
    margin:0;
    font-size:23px;
    font-weight:normal;
    color:#e1c4ff;
}

.adminTitle small{
    display:block;
    margin-top:2px;
    color:#a996b2;
    font-size:11px;
}

.logoutBtn{
    border:1px solid #633b7d;
    background:#12091b;
    color:#d6bde2;
    padding:7px 11px;
    border-radius:7px;
    font-family:inherit;
    font-size:12px;
    cursor:pointer;
}

.logoutBtn:hover{
    background:#261036;
    color:white;
}

/* =========================
   ESTADÍSTICAS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:14px;
}

.statCard{
    min-width:0;
    padding:12px 13px;
    border:1px solid rgba(179,110,240,.27);
    border-radius:10px;
    background:rgba(17,7,27,.88);
}

.statTop{
    display:flex;
    align-items:center;
    gap:7px;
    color:#bca7c7;
    font-size:11px;
}

.statIcon{
    font-size:17px;
}

.statNumber{
    margin-top:5px;
    font-size:24px;
    color:#e5c8ff;
    line-height:1;
}

/* =========================
   PANEL
========================= */

.panel{
    overflow:hidden;
    border:1px solid rgba(179,110,240,.28);
    border-radius:11px;
    background:rgba(13,5,22,.91);
}

.panelHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:11px 13px;
    border-bottom:1px solid rgba(179,110,240,.2);
}

.panelHeader h2{
    margin:0;
    font-size:15px;
    font-weight:normal;
    color:#dfc1f5;
}

.refreshBtn{
    border:1px solid #65427b;
    background:#110819;
    color:#d8c2e4;
    border-radius:6px;
    padding:6px 9px;
    font-family:inherit;
    font-size:11px;
    cursor:pointer;
}

.refreshBtn:hover{
    background:#251030;
}

/* =========================
   FILTROS
========================= */

.filters{
    display:grid;
    grid-template-columns:1.6fr 1fr 1fr;
    gap:8px;
    padding:10px 12px;
    border-bottom:1px solid rgba(179,110,240,.16);
}

.filters input,
.filters select{
    width:100%;
    padding:8px 9px;
    border:1px solid #493255;
    border-radius:6px;
    outline:none;
    background:#09050d;
    color:#eee3f3;
    font-family:inherit;
    font-size:11px;
}

.filters input:focus,
.filters select:focus{
    border-color:#9561b8;
}

/* =========================
   TABLA
========================= */

.tableWrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:700px;
    border-collapse:collapse;
}

th{
    padding:8px 9px;
    background:#12081b;
    color:#a991b6;
    border-bottom:1px solid rgba(179,110,240,.2);
    text-align:left;
    font-size:10px;
    font-weight:normal;
    text-transform:uppercase;
    letter-spacing:.3px;
}

td{
    padding:8px 9px;
    border-bottom:1px solid rgba(179,110,240,.10);
    color:#ded0e4;
    font-size:11px;
    vertical-align:middle;
}

tbody tr:hover{
    background:rgba(128,65,170,.07);
}

.empty,
.loading{
    padding:25px 15px;
    text-align:center;
    color:#9d8ba5;
    font-size:12px;
}

/* =========================
   BADGES
========================= */

.badge{
    display:inline-block;
    padding:3px 6px;
    border-radius:20px;
    font-size:9px;
    white-space:nowrap;
}

.badgeYes{
    background:rgba(78,180,117,.12);
    border:1px solid rgba(100,210,135,.28);
    color:#9fe6b3;
}

.badgeNo{
    background:rgba(220,80,80,.10);
    border:1px solid rgba(220,100,100,.25);
    color:#f1a2a2;
}

.badgeNeutral{
    background:rgba(170,130,190,.10);
    border:1px solid rgba(170,130,190,.2);
    color:#c8b6cf;
}

/* =========================
   MENSAJES
========================= */

.message{
    display:none;
    margin:10px 12px;
    padding:9px 11px;
    border-radius:7px;
    font-size:11px;
}

.message.error{
    display:block;
    color:#ffb1b1;
    background:rgba(120,30,30,.15);
    border:1px solid rgba(210,80,80,.25);
}

.adminFooter{
    padding-top:12px;
    text-align:center;
    color:#75657d;
    font-size:10px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){

    #adminApp{
        padding:12px 10px 25px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .filters{
        grid-template-columns:1fr 1fr;
    }

    .filters input{
        grid-column:1 / -1;
    }
}

@media(max-width:500px){

    .adminHeader{
        padding:10px 11px;
    }

    .adminTitle h1{
        font-size:19px;
    }

    .adminTitle .symbol{
        font-size:21px;
    }

    .adminTitle small{
        font-size:9px;
    }

    .logoutBtn{
        padding:6px 8px;
        font-size:10px;
    }

    .stats{
        gap:7px;
    }

    .statCard{
        padding:10px;
    }

    .statNumber{
        font-size:21px;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .filters input{
        grid-column:auto;
    }

    .panelHeader{
        padding:9px 10px;
    }

    .panelHeader h2{
        font-size:13px;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<section id="loginScreen">

    <div class="loginBox">

        <div class="loginSymbol">✦</div>

        <h1>Administración</h1>

        <p>Panel privado de Velunara</p>

        <input
            type="email"
            id="adminEmail"
            placeholder="Correo electrónico"
            autocomplete="username"
        >

        <input
            type="password"
            id="adminPassword"
            placeholder="Contraseña"
            autocomplete="current-password"
        >

        <button
            id="loginButton"
            onclick="login()"
        >
            Iniciar sesión
        </button>

        <div id="errorLogin"></div>

    </div>

</section>


<!-- =========================
     ADMIN
========================= -->

<main id="adminApp">

    <header class="adminHeader">

        <div class="adminTitle">

            <div class="symbol">✦</div>

            <div>
                <h1>Velunara</h1>
                <small>Panel de administración</small>
            </div>

        </div>

        <button
            class="logoutBtn"
            onclick="logout()"
        >
            Cerrar sesión
        </button>

    </header>


    <!-- ESTADÍSTICAS -->

    <section class="stats">

        <div class="statCard">

            <div class="statTop">
                <span class="statIcon">💌</span>
                <span>Confirmaciones</span>
            </div>

            <div
                class="statNumber"
                id="statConfirmaciones"
            >
                0
            </div>

        </div>


        <div class="statCard">

            <div class="statTop">
                <span class="statIcon">✨</span>
                <span>Asistirán</span>
            </div>

            <div
                class="statNumber"
                id="statAsistiran"
            >
                0
            </div>

        </div>


        <div class="statCard">

            <div class="statTop">
                <span class="statIcon">👤</span>
                <span>Adultos</span>
            </div>

            <div
                class="statNumber"
                id="statAdultos"
            >
                0
            </div>

        </div>


        <div class="statCard">

            <div class="statTop">
                <span class="statIcon">🧒</span>
                <span>Niños</span>
            </div>

            <div
                class="statNumber"
                id="statNinos"
            >
                0
            </div>

        </div>

    </section>


    <!-- TABLA -->

    <section class="panel">

        <div class="panelHeader">

            <h2>
                Confirmaciones de invitados
            </h2>

            <button
                class="refreshBtn"
                onclick="loadConfirmations()"
            >
                ↻ Actualizar
            </button>

        </div>


        <div class="filters">

            <input
                type="text"
                id="searchInput"
                placeholder="Buscar por nombre..."
                oninput="applyFilters()"
            >

            <select
                id="attendanceFilter"
                onchange="applyFilters()"
            >

                <option value="todos">
                    Todas las respuestas
                </option>

                <option value="si">
                    Asistirán
                </option>

                <option value="no">
                    No asistirán
                </option>

            </select>


            <select
                id="categoryFilter"
                onchange="applyFilters()"
            >

                <option value="todos">
                    Todas las categorías
                </option>

                <option value="adultos">
                    Con adultos
                </option>

                <option value="ninos">
                    Con niños
                </option>

            </select>

        </div>


        <div id="message"></div>


        <div class="tableWrap">

            <table>

                <thead>

                    <tr>
                        <th>Nombre</th>
                        <th>Asistencia</th>
                        <th>Adultos</th>
                        <th>Niños</th>
                        <th>Total</th>
                        <th>Teléfono</th>
                    </tr>

                </thead>

                <tbody id="tableBody">

                    <tr>

                        <td
                            colspan="6"
                            class="loading"
                        >
                            Cargando confirmaciones...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


    <div class="adminFooter">
        Velunara · Panel privado
    </div>

</main>


<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://ibdjtobuadgzozbggxxu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_QYI1nQKLZly1FHoSjgaqcg_xTS3WDSE";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let confirmations = [];


/* =========================
   ELEMENTOS
========================= */

const loginScreen =
    document.getElementById(
        "loginScreen"
    );

const adminApp =
    document.getElementById(
        "adminApp"
    );

const adminEmail =
    document.getElementById(
        "adminEmail"
    );

const adminPassword =
    document.getElementById(
        "adminPassword"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const errorLogin =
    document.getElementById(
        "errorLogin"
    );

const tableBody =
    document.getElementById(
        "tableBody"
    );

const message =
    document.getElementById(
        "message"
    );


/* =========================
   LOGIN CON SUPABASE AUTH
========================= */

async function login(){

    const email =
        adminEmail.value
            .trim()
            .toLowerCase();

    const password =
        adminPassword.value;


    errorLogin.textContent = "";


    if(!email){

        errorLogin.textContent =
            "Escribe el correo.";

        adminEmail.focus();

        return;
    }


    if(!password){

        errorLogin.textContent =
            "Escribe la contraseña.";

        adminPassword.focus();

        return;
    }


    loginButton.disabled = true;

    loginButton.textContent =
        "Comprobando...";


    try{

        const {
            data,
            error
        } =
            await supabaseClient.auth
                .signInWithPassword({
                    email:email,
                    password:password
                });


        if(error){

            console.error(error);


            errorLogin.textContent =
                "El correo o la contraseña no son correctos.";

            adminPassword.value = "";

            return;
        }


        if(!data.session){

            errorLogin.textContent =
                "No se pudo iniciar la sesión.";

            return;
        }


        showAdmin();


    }catch(error){

        console.error(error);


        errorLogin.textContent =
            "No se pudo iniciar sesión. Revisa tu conexión a Internet.";

    }finally{

        loginButton.disabled = false;

        loginButton.textContent =
            "Iniciar sesión";

    }

}


/* =========================
   MOSTRAR ADMIN
========================= */

function showAdmin(){

    loginScreen.style.display =
        "none";

    adminApp.style.display =
        "block";

    loadConfirmations();

}


/* =========================
   CERRAR SESIÓN
========================= */

async function logout(){

    await supabaseClient.auth.signOut();


    adminApp.style.display =
        "none";

    loginScreen.style.display =
        "flex";


    adminEmail.value = "";

    adminPassword.value = "";

    errorLogin.textContent = "";

}


/* =========================
   COMPROBAR SESIÓN REAL
========================= */

async function checkSession(){

    try{

        const {
            data
        } =
            await supabaseClient.auth
                .getSession();


        if(
            data &&
            data.session
        ){

            showAdmin();

        }

    }catch(error){

        console.error(error);

    }

}


checkSession();


/* =========================
   CARGAR CONFIRMACIONES
========================= */

async function loadConfirmations(){

    tableBody.innerHTML = `
        <tr>
            <td
                colspan="6"
                class="loading"
            >
                Cargando confirmaciones...
            </td>
        </tr>
    `;


    hideMessage();


    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from("confirmaciones")
                .select("*");


        if(error){

            console.error(error);


            tableBody.innerHTML = `
                <tr>
                    <td
                        colspan="6"
                        class="empty"
                    >
                        No se pudieron cargar las confirmaciones.
                    </td>
                </tr>
            `;


            showMessage(
                "No se pudieron cargar las confirmaciones. Revisa los permisos de la tabla.",
                "error"
            );


            return;
        }


        confirmations =
            Array.isArray(data)
                ? data
                : [];


        updateStats();

        applyFilters();


    }catch(error){

        console.error(error);


        tableBody.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="empty"
                >
                    Ocurrió un problema al cargar los datos.
                </td>
            </tr>
        `;


        showMessage(
            "Ocurrió un problema al cargar los datos. Intenta actualizar la página.",
            "error"
        );

    }

}


/* =========================
   ESTADÍSTICAS
========================= */

function updateStats(){

    const total =
        confirmations.length;


    const attending =
        confirmations.filter(
            row =>
                String(
                    row.asistencia || ""
                ).toLowerCase() === "si"
        );


    let adults = 0;

    let children = 0;


    attending.forEach(row => {

        adults +=
            Number(row.adultos) || 0;

        children +=
            Number(row.ninos) || 0;

    });


    document.getElementById(
        "statConfirmaciones"
    ).textContent =
        total;


    document.getElementById(
        "statAsistiran"
    ).textContent =
        adults + children;


    document.getElementById(
        "statAdultos"
    ).textContent =
        adults;


    document.getElementById(
        "statNinos"
    ).textContent =
        children;

}


/* =========================
   FILTROS
========================= */

function applyFilters(){

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    const attendance =
        document.getElementById(
            "attendanceFilter"
        ).value;


    const category =
        document.getElementById(
            "categoryFilter"
        ).value;


    const filtered =
        confirmations.filter(row => {

            const name =
                String(
                    row.nombre || ""
                ).toLowerCase();


            const rowAttendance =
                String(
                    row.asistencia || ""
                ).toLowerCase();


            const adults =
                Number(row.adultos) || 0;


            const children =
                Number(row.ninos) || 0;


            if(
                search &&
                !name.includes(search)
            ){

                return false;

            }


            if(
                attendance !== "todos" &&
                rowAttendance !== attendance
            ){

                return false;

            }


            if(
                category === "adultos" &&
                adults <= 0
            ){

                return false;

            }


            if(
                category === "ninos" &&
                children <= 0
            ){

                return false;

            }


            return true;

        });


    renderTable(filtered);

}


/* =========================
   TABLA
========================= */

function renderTable(rows){

    if(!rows.length){

        tableBody.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="empty"
                >
                    No hay confirmaciones que coincidan.
                </td>
            </tr>
        `;

        return;
    }


    tableBody.innerHTML =
        rows.map(row => {

            const nombre =
                escapeHTML(
                    row.nombre ||
                    "Sin nombre"
                );


            const asistencia =
                String(
                    row.asistencia || ""
                ).toLowerCase();


            let badge =
                `<span class="badge badgeNeutral">Sin respuesta</span>`;


            if(
                asistencia === "si"
            ){

                badge =
                    `<span class="badge badgeYes">Asistirá</span>`;

            }


            if(
                asistencia === "no"
            ){

                badge =
                    `<span class="badge badgeNo">No asistirá</span>`;

            }


            const adultos =
                Number(row.adultos) || 0;


            const ninos =
                Number(row.ninos) || 0;


            let personas =
                Number(row.personas);


            if(
                !Number.isFinite(personas)
            ){

                personas =
                    adultos + ninos;

            }


            const telefono =
                escapeHTML(
                    row.telefono ||
                    "No indicado"
                );


            return `
                <tr>

                    <td>
                        ${nombre}
                    </td>

                    <td>
                        ${badge}
                    </td>

                    <td>
                        ${adultos}
                    </td>

                    <td>
                        ${ninos}
                    </td>

                    <td>
                        ${personas}
                    </td>

                    <td>
                        ${telefono}
                    </td>

                </tr>
            `;

        }).join("");

}


/* =========================
   SEGURIDAD HTML
========================= */

function escapeHTML(value){

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================
   MENSAJES
========================= */

function showMessage(
    text,
    type
){

    message.className =
        "message " + type;

    message.textContent =
        text;

}


function hideMessage(){

    message.className = "";

    message.textContent = "";

}


/* =========================
   ENTER PARA LOGIN
========================= */

adminEmail.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            login();

        }

    }
);


adminPassword.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            login();

        }

    }
);

</script>

</body>
</html>
