<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://ibdjtobuadgzozbggxxu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_QYI1nQKLZly1FHoSjgaqcg_xTS3WDSE";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   ELEMENTOS
========================================= */

const videoInicial =
    document.getElementById(
        "videoInicial"
    );

const entrar =
    document.getElementById(
        "entrar"
    );

const contenido =
    document.getElementById(
        "contenido"
    );

const mananitasAudio =
    document.getElementById(
        "mananitasAudio"
    );

const video2Container =
    document.getElementById(
        "video2Container"
    );

const video2 =
    document.getElementById(
        "video2"
    );


const birthdayStatus =
    document.getElementById(
        "birthdayStatus"
    );

const attendanceButton =
    document.getElementById(
        "attendanceButton"
    );

const celebrationMessage =
    document.getElementById(
        "celebrationMessage"
    );

const confirmHint =
    document.getElementById(
        "confirmHint"
    );


const daysElement =
    document.getElementById(
        "days"
    );

const hoursElement =
    document.getElementById(
        "hours"
    );

const minutesElement =
    document.getElementById(
        "minutes"
    );

const secondsElement =
    document.getElementById(
        "seconds"
    );


const confirmModal =
    document.getElementById(
        "confirmModal"
    );

const confirmForm =
    document.getElementById(
        "confirmForm"
    );

const cancelConfirm =
    document.getElementById(
        "cancelConfirm"
    );


/* =========================================
   VIDEO INICIAL
========================================= */

let videoTerminado = false;


/*
 * Cuando termina el video inicial,
 * desaparece y empiezan Las Mañanitas.
 */

videoInicial.addEventListener(
    "ended",
    iniciarInvitacion
);


/*
 * Botón ENTRAR
 */

entrar.addEventListener(
    "click",
    async () => {

        try{

            await videoInicial.play();

            entrar.style.display =
                "none";

        }catch(error){

            console.log(
                "No se pudo reproducir el video:",
                error
            );

        }

    }
);


/* =========================================
   INICIAR INVITACIÓN
========================================= */

function iniciarInvitacion(){

    if(videoTerminado)
        return;

    videoTerminado = true;


    videoInicial.style.display =
        "none";

    entrar.style.display =
        "none";

    contenido.style.display =
        "block";


    /*
     * Las Mañanitas comienzan
     * inmediatamente después del video.
     */

    mananitasAudio.currentTime = 0;

    mananitasAudio.play()
        .catch(
            error =>
                console.log(
                    "El navegador bloqueó el audio:",
                    error
                )
        );

}


/* =========================================
   FECHA LOCAL
========================================= */

function fechaLocal(
    anio,
    mes,
    dia,
    hora = 0,
    minuto = 0,
    segundo = 0
){

    return new Date(
        anio,
        mes - 1,
        dia,
        hora,
        minuto,
        segundo,
        0
    );

}


/* =========================================
   CONTADOR EN CERO
========================================= */

function ponerContadorEnCero(){

    daysElement.textContent =
        "0";

    hoursElement.textContent =
        "0";

    minutesElement.textContent =
        "0";

    secondsElement.textContent =
        "0";

}


/* =========================================
   ACTUALIZAR CONTADOR
========================================= */

function actualizarContador(
    destino,
    ahora
){

    const diferencia =
        destino.getTime()
        -
        ahora.getTime();


    if(
        diferencia <= 0
    ){

        ponerContadorEnCero();

        return;

    }


    const dias =
        Math.floor(
            diferencia /
            (
                1000 *
                60 *
                60 *
                24
            )
        );


    const horas =
        Math.floor(
            (
                diferencia /
                (
                    1000 *
                    60 *
                    60
                )
            ) % 24
        );


    const minutos =
        Math.floor(
            (
                diferencia /
                (
                    1000 *
                    60
                )
            ) % 60
        );


    const segundos =
        Math.floor(
            (
                diferencia /
                1000
            ) % 60
        );


    daysElement.textContent =
        dias;

    hoursElement.textContent =
        horas;

    minutesElement.textContent =
        minutos;

    secondsElement.textContent =
        segundos;

}


/* =========================================
   CONFETI
========================================= */

let confetiActivo = false;

let intervaloConfeti = null;


function crearConfeti(){

    if(!confetiActivo)
        return;


    const pieza =
        document.createElement(
            "div"
        );

    pieza.className =
        "confetti";


    pieza.style.left =
        Math.random() * 100 +
        "vw";


    pieza.style.animationDuration =
        (
            3 +
            Math.random() * 4
        ) +
        "s";


    pieza.style.transform =
        `rotate(${
            Math.random() * 360
        }deg)`;


    /*
     * Se usan colores aleatorios
     * directamente en la pieza.
     */

    const colores = [
        "#f1cf76",
        "#e08be9",
        "#ffffff",
        "#ff9fcf",
        "#b98cff",
        "#ffd85c"
    ];


    pieza.style.background =
        colores[
            Math.floor(
                Math.random() *
                colores.length
            )
        ];


    document.body.appendChild(
        pieza
    );


    setTimeout(
        () => pieza.remove(),
        7500
    );

}


function iniciarConfeti(){

    if(confetiActivo)
        return;


    confetiActivo = true;


    crearConfeti();


    intervaloConfeti =
        setInterval(
            crearConfeti,
            180
        );

}


function detenerConfeti(){

    confetiActivo = false;


    if(intervaloConfeti){

        clearInterval(
            intervaloConfeti
        );

        intervaloConfeti =
            null;

    }

}


/* =========================================
   ESTADO Y CONTADOR
========================================= */

function actualizarEstadoYContador(){

    const ahora =
        new Date();


    const anio =
        ahora.getFullYear();


    /*
     * 20 DE SEPTIEMBRE 00:00
     */

    const apertura =
        fechaLocal(
            anio,
            9,
            20,
            0,
            0,
            0
        );


    /*
     * 27 DE SEPTIEMBRE 00:00
     */

    const inicioFestejo =
        fechaLocal(
            anio,
            9,
            27,
            0,
            0,
            0
        );


    /*
     * 27 DE SEPTIEMBRE 16:00
     */

    const finContador =
        fechaLocal(
            anio,
            9,
            27,
            16,
            0,
            0
        );


    /*
     * 28 DE SEPTIEMBRE 00:00
     */

    const finFestejo =
        fechaLocal(
            anio,
            9,
            28,
            0,
            0,
            0
        );


    /* =====================================
       20 - 26 SEPTIEMBRE
    ====================================== */

    if(
        ahora >= apertura &&
        ahora < inicioFestejo
    ){

        birthdayStatus.textContent =
            "📝 CONFIRMAR ASISTENCIA";

        birthdayStatus.className =
            "birthday-status confirmar";


        attendanceButton.textContent =
            "📝 CONFIRMAR ASISTENCIA";

        attendanceButton.disabled =
            false;

        attendanceButton.dataset.mode =
            "confirmar";


        confirmHint.innerHTML =
            "✨ Confirmación de asistencia disponible.";


        celebrationMessage.classList.add(
            "hidden"
        );


        actualizarContador(
            inicioFestejo,
            ahora
        );


        detenerConfeti();


        return;

    }


    /* =====================================
       27 SEPTIEMBRE
    ====================================== */

    if(
        ahora >= inicioFestejo &&
        ahora < finFestejo
    ){

        birthdayStatus.textContent =
            "🎉 FESTEJANDO";

        birthdayStatus.className =
            "birthday-status festejando";


        attendanceButton.textContent =
            "🎉 FESTEJANDO";

        attendanceButton.disabled =
            true;

        attendanceButton.dataset.mode =
            "festejando";


        confirmHint.innerHTML =
            "🎊 ¡Hoy es el gran día!";


        /*
         * CONFETI TODO EL 27.
         */

        iniciarConfeti();


        /*
         * ANTES DE LAS 4 PM:
         * CONTADOR HASTA LAS 16:00.
         */

        if(
            ahora < finContador
        ){

            celebrationMessage.classList.add(
                "hidden"
            );


            actualizarContador(
                finContador,
                ahora
            );

        }

        /*
         * A LAS 4 PM:
         * CONTADOR EN CERO.
         */

        else{

            ponerContadorEnCero();


            celebrationMessage.classList.remove(
                "hidden"
            );

        }


        return;

    }


    /* =====================================
       DESPUÉS DEL 27
       ESPERAR AL SIGUIENTE 20
    ====================================== */

    birthdayStatus.textContent =
        "⏳ ESPERANDO";

    birthdayStatus.className =
        "birthday-status esperando";


    attendanceButton.textContent =
        "⏳ ESPERANDO";

    attendanceButton.disabled =
        true;

    attendanceButton.dataset.mode =
        "esperando";


    celebrationMessage.classList.add(
        "hidden"
    );


    detenerConfeti();


    confirmHint.innerHTML =
        "⏳ Esperando al próximo ciclo.";


    /*
     * Si todavía no llegamos al 20
     * de este año, esperamos al 20.
     */

    let siguienteApertura;


    if(
        ahora < apertura
    ){

        siguienteApertura =
            apertura;

    }

    /*
     * Si ya pasó el 20 de este año,
     * esperamos al 20 del próximo.
     */

    else{

        siguienteApertura =
            fechaLocal(
                anio + 1,
                9,
                20,
                0,
                0,
                0
            );

    }


    actualizarContador(
        siguienteApertura,
        ahora
    );

}


/* =========================================
   ARRANCAR ESTADO
========================================= */

actualizarEstadoYContador();


setInterval(
    actualizarEstadoYContador,
    1000
);


/* =========================================
   MODAL
========================================= */

attendanceButton.addEventListener(
    "click",
    () => {

        /*
         * Solo se abre durante
         * el periodo permitido.
         */

        if(
            attendanceButton.dataset.mode
            !==
            "confirmar"
        ){

            return;

        }


        confirmModal.classList.add(
            "active"
        );

    }
);


/* =========================================
   CERRAR MODAL
========================================= */

cancelConfirm.addEventListener(
    "click",
    () => {

        confirmModal.classList.remove(
            "active"
        );

    }
);


/*
 * Cerrar haciendo clic fuera.
 */

confirmModal.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            confirmModal
        ){

            confirmModal.classList.remove(
                "active"
            );

        }

    }
);


/* =========================================
   CONFIRMAR ASISTENCIA
========================================= */

confirmForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        /*
         * Volvemos a comprobar la fecha
         * para evitar que alguien deje
         * el modal abierto y espere hasta
         * que cambie el día.
         */

        const ahora =
            new Date();

        const anio =
            ahora.getFullYear();


        const apertura =
            fechaLocal(
                anio,
                9,
                20,
                0,
                0,
                0
            );


        const inicioFestejo =
            fechaLocal(
                anio,
                9,
                27,
                0,
                0,
                0
            );


        if(
            ahora < apertura ||
            ahora >= inicioFestejo
        ){

            alert(
                "La confirmación ya no está disponible."
            );

            confirmModal.classList.remove(
                "active"
            );

            actualizarEstadoYContador();

            return;

        }


        const nombre =
            document.getElementById(
                "nombre"
            ).value.trim();


        const personas =
            Number(
                document.getElementById(
                    "personas"
                ).value
            );


        const adultos =
            Number(
                document.getElementById(
                    "adultos"
                ).value
            );


        const ninos =
            Number(
                document.getElementById(
                    "ninos"
                ).value
            );


        const asistencia =
            document.getElementById(
                "asistencia"
            ).value;


        const telefono =
            document.getElementById(
                "telefono"
            ).value.trim();


        /*
         * Validación básica.
         */

        if(
            !nombre ||
            !personas ||
            !asistencia
        ){

            alert(
                "Completa los datos requeridos."
            );

            return;

        }


        /*
         * Comprobamos que adultos + niños
         * coincida con el total.
         */

        if(
            adultos +
            ninos !==
            personas
        ){

            alert(
                "La cantidad de adultos y niños debe coincidir con el total de personas."
            );

            return;

        }


        const boton =
            document.getElementById(
                "confirmSubmit"
            );


        boton.disabled = true;

        boton.textContent =
            "Guardando...";


        try{

            const datos = {

                nombre:
                    nombre,

                personas:
                    personas,

                adultos:
                    adultos,

                ninos:
                    ninos,

                asistencia:
                    asistencia

            };


            /*
             * Teléfono solo si fue escrito.
             */

            if(telefono){

                datos.telefono =
                    telefono;

            }


            const {
                error
            } =
                await supabaseClient
                    .from(
                        "confirmaciones"
                    )
                    .insert(
                        datos
                    );


            if(error){

                console.error(
                    error
                );

                alert(
                    "No se pudo guardar la confirmación. Inténtalo de nuevo."
                );

                return;

            }


            alert(
                "🎉 ¡Tu confirmación fue guardada correctamente!"
            );


            confirmForm.reset();


            confirmModal.classList.remove(
                "active"
            );


        }catch(error){

            console.error(
                error
            );

            alert(
                "Ocurrió un error al guardar la confirmación."
            );

        }finally{

            boton.disabled =
                false;

            boton.textContent =
                "Confirmar";

        }

    }
);


/* =========================================
   VIDEO 2
========================================= */

function reproducirVideo2(){

    video2Container.style.display =
        "block";


    contenido.style.display =
        "none";


    /*
     * Las Mañanitas se detienen
     * durante el video 2.
     */

    mananitasAudio.pause();


    mananitasAudio.currentTime =
        0;


    video2.currentTime =
        0;


    video2.play()
        .catch(
            error =>
                console.log(
                    "No se pudo reproducir video2:",
                    error
                )
        );

}


/* =========================================
   CUANDO TERMINA VIDEO 2
========================================= */

video2.addEventListener(
    "ended",
    () => {

        video2Container.style.display =
            "none";


        contenido.style.display =
            "block";


        /*
         * Regresan Las Mañanitas
         * después del video 2.
         */

        mananitasAudio.currentTime =
            0;


        mananitasAudio.play()
            .catch(
                error =>
                    console.log(
                        "No se pudo reproducir Las Mañanitas:",
                        error
                    )
            );

    }
);


/* =========================================
   CERRAR VIDEO 2 CON ESC
========================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape" &&
            video2Container.style.display ===
            "block"
        ){

            video2.pause();


            video2Container.style.display =
                "none";


            contenido.style.display =
                "block";


            mananitasAudio.play()
                .catch(
                    () => {}
                );

        }

    }
);
