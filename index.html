/* =========================

.scroll-tutorial{
    position:fixed;
    top:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:500;

    width:min(90%,500px);

    padding:13px 20px;

    text-align:center;

    border-radius:20px;

    background:rgba(25,8,39,.88);

    border:1px solid rgba(211,172,240,.3);

    box-shadow:0 10px 30px rgba(0,0,0,.35);

    opacity:1;
    visibility:visible;

    transition:
        opacity 1s ease,
        transform 1s ease,
        visibility 1s ease;
}

.scroll-tutorial.fade-out{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transform:translate(-50%,-25px);
}

.scroll-tutorial.permanently-hidden{
    display:none;
}

.scroll-tutorial-title{
    font-size:17px;
    letter-spacing:1px;
    margin-bottom:7px;
}

.scroll-tutorial-text{
    font-size:14px;
    opacity:.9;
}

.scroll-tutorial-arrow{
    font-size:30px;
    line-height:1;
    margin-top:6px;

    animation:
        arrowMove 1.2s ease-in-out infinite;
}

@keyframes arrowMove{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(8px);
    }

}
