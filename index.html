*{

}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 10%,
            #35144f 0%,
            #210d35 38%,
            #100719 72%,
            #07030c 100%

    color:white;
    font-family:Georgia,serif;
    overflow-x:hidden;
}

button,
input,
select{
    font-family:inherit;
}

.hidden{
    display:none !important;
}


/* =========================
   ESTRELLAS
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.45;

    background-image:
        radial-gradient(circle,#ffffff 1px,transparent 1px),
        radial-gradient(circle,#d9b7ff 1px,transparent 1px);

    background-size:
        95px 95px,
        145px 145px;

    background-position:
        10px 20px,
        60px 80px;

    z-index:0;
}


/* =========================
   VIDEO 1
========================= */

#introVideoScreen{
    position:fixed;
    inset:0;

    width:100vw;
    height:100vh;
    height:100dvh;

    margin:0;
    padding:0;

    overflow:hidden;

    z-index:9999;

    background:#09030f;

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:1;
    visibility:visible;

    transition:
        opacity 1.8s ease,
        visibility 1.8s ease;
}

#introVideoScreen.fade-out{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

#introVideo{
    position:absolute;
    inset:0;

    display:block;

    width:100vw;
    height:100vh;
    height:100dvh;

    min-width:100vw;
    min-height:100vh;
    min-height:100dvh;

    margin:0;
    padding:0;

    object-fit:cover;
    object-position:center center;

    background:#000;

    opacity:0;
    visibility:hidden;

    transform:scale(1.04);

    transition:
        opacity 2s ease,
        transform 3s ease;
}

#introVideo.visible{
    opacity:1 !important;
    visibility:visible !important;
    transform:scale(1);
}

#introStart{
    position:absolute;
    inset:0;

    z-index:2;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:25px;

    opacity:1;
    transform:translateY(0);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

#introStart.hidden-start{
    opacity:0;
    transform:translateY(-15px);
    pointer-events:none;
}

.introStartTitle{
    font-family:
        "Cinzel Decorative",
        Georgia,
        serif;

    font-size:

    letter-spacing:4px;

    color:#f1ddff;

    text-shadow:
        0 0 12px rgba(210,160,255,.8),
        0 0 35px rgba(150,80,210,.6);
}

.introStartText{
    margin-top:14px;

    font-size:18px;

    color:#e8d8f2;
}

#startInvitation{
    margin-top:30px;

    border:1px solid #cba5ec;
    border-radius:30px;

    background:rgba(80,35,110,.75);

    color:white;

    cursor:pointer;

    font-size:15px;
    letter-spacing:1px;

    transition:.3s;
}

#startInvitation:hover{
    transform:scale(1.05);

    background:rgba(110,55,145,.85);
}


/* =========================
   TUTORIAL
========================= */

.scroll-tutorial{
    position:fixed;

    top:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:500;

    width:min(90%,500px);

    padding:13px 20px;

    text-align:center;

    border-radius:20px;

    background:rgba(25,8,39,.88);

    border:
        1px solid
        rgba(211,172,240,.3);

    box-shadow:
        0 10px 30px rgba(0,0,0,.35);

    opacity:1;
    visibility:visible;

    transition:
        opacity 1s ease,
        transform 1s ease,
        visibility 1s ease;
}

.scroll-tutorial.fade-out{
    opacity:0;
    visibility:hidden;
    pointer-events:none;

    transform:
        translate(-50%,-25px);
}

.scroll-tutorial.permanently-hidden{

}

}

        infinite

}

@keyframes arrowDown{

    }

}
